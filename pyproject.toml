[tool.poetry]
name = "india-stocks-api"
version = "2.0.0"
description = "A unified API for Indian stock market brokers"
authors = ["Apurv Salunke <salunke.apurv7@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "india_stocks_api"}]
homepage = "https://github.com/Apurv-Salunke/india-stocks-api"
documentation = "https://github.com/Apurv-Salunke/india-stocks-api/wiki"
repository = "https://github.com/Apurv-Salunke/india-stocks-api"

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.28.1"
pandas = "^2.3.3"
pyotp = "^2.9.0"
sqlalchemy = "^2.0.0"
python-dateutil = "^2.9.0"
pyzmq = "^27.1.0"
logzero = "^1.7.0"
websocket-client = "^1.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
python-dotenv = "^1.2.1"
pytest-mock = "^3.14.0"
respx = "^0.22.0"
ruff = "^0.9.0"
mypy = "^1.14.0"
sphinx = "^7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live broker credentials (deselect with '-m not integration')",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"india_stocks_api/internal/angel/**" = ["E501", "E712", "E722", "F841"]
"india_stocks_api/internal/context.py" = ["E402"]
"tests/scripts/**" = ["E402", "E501", "F841"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "india_stocks_api.internal.*"
ignore_errors = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
