name: CI Workflow

# Assigning permissions to jobs
permissions:
  contents: write
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - dev
      - feature-funds

  pull_request:
    branches:
      - main
      - dev
      - feature-funds


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: |
          ruff check .

